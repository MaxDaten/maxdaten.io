# Declares which secrets this repo needs — never their values.
# Values live in the provider from ~/.config/secretspec/config.toml (macOS Keychain via keyring://,
# entries named secretspec/maxdaten-io/default/<KEY>).
#   secretspec check     verify / interactively set missing values

[project]
name = "maxdaten-io"
revision = "1.0"

[profiles.default]
GOOGLE_GEMINI_API_KEY = { description = "Gemini image generation (devenv script gemini-image). Key from https://aistudio.google.com/apikey", required = true }

# One scope per consumer process: each sees only its own key.
[scopes.gemini]
secrets = ["GOOGLE_GEMINI_API_KEY"]
